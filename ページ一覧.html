<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ページ一覧｜調剤報酬・薬歴まとめ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --text-xs:13px; --text-sm:15px; --text-md:16px; --text-lg:18px; --text-xl:22px;
  --pad-card:22px; --gap-card:16px;
  --blue:#1e5fa8; --ink:#222222;
  --bg:#f3f4f6; --white:#ffffff;
  --box-blue:#e4f0f8; --box-gray:#f2f2f2;
  --border:#d1d5db; --border-dk:#9ca3af;
  --radius:10px; --radius-sm:6px; --bw:0.5px; --bw-h:1px;
  --txt-2:#444444; --txt-3:#5e6470;
}
body { font-family:"Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); font-size:var(--text-md); line-height:1.8; padding:32px 16px 60px; }
.page { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:var(--gap-card); }

.page-title-wrap { padding:6px 0; }
.page-title-wrap h1 { font-size:var(--text-xl); font-weight:900; letter-spacing:-0.01em; }
.page-title-wrap p { font-size:var(--text-sm); font-weight:500; color:var(--txt-2); margin-top:4px; }

.card { background:var(--white); border:var(--bw) solid var(--border); border-radius:var(--radius); padding:var(--pad-card); }

/* ── 検索 ── */
.finder { display:flex; flex-direction:column; gap:13px; }
.finder .box { position:relative; }
.finder .box svg {
  position:absolute; left:17px; top:50%; transform:translateY(-50%);
  width:21px; height:21px; stroke:var(--border-dk); fill:none; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round; pointer-events:none;
}
.finder input {
  width:100%; font-family:inherit; font-size:var(--text-lg); font-weight:500;
  padding:17px 18px 17px 48px; border:var(--bw-h) solid var(--border-dk); border-radius:var(--radius-sm);
  background:var(--white); color:var(--ink);
}
.finder input::placeholder { color:#9aa1ad; font-weight:400; }
.finder input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(30,95,168,.12); }
.finder input:focus + svg, .finder .box:focus-within svg { stroke:var(--blue); }
.chips { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.chips .lab { font-size:var(--text-xs); font-weight:700; color:var(--txt-3); margin-right:2px; }
.chip {
  font-family:inherit; font-size:var(--text-xs); font-weight:700; color:var(--blue);
  background:var(--white); border:var(--bw-h) solid var(--border); border-radius:999px;
  padding:5px 13px; cursor:pointer; line-height:1.5;
}
.chip:hover { background:#f0f6fc; border-color:#bcd3ee; }
.chip.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.hint { font-size:var(--text-xs); color:var(--txt-3); line-height:1.7; }
.hint b { color:var(--blue); font-weight:900; }

/* ── カテゴリ（折りたたみ） ── */
.grp { background:var(--white); border:var(--bw) solid var(--border); border-radius:var(--radius); overflow:hidden; }
.grp + .grp { margin-top:10px; }
/* 開いたカテゴリーへスクロールしたとき、共通ヘッダーに隠れないようにする */
.grp { scroll-margin-top:70px; }
.grp > summary {
  list-style:none; cursor:pointer; padding:15px var(--pad-card);
  display:flex; align-items:center; gap:11px; flex-wrap:wrap;
}
.grp > summary::-webkit-details-marker { display:none; }
.grp > summary::before {
  content:"▶"; font-size:10px; color:var(--txt-3); transition:transform .15s; flex-shrink:0;
}
.grp[open] > summary::before { transform:rotate(90deg); }
.grp > summary:hover { background:#fafbfc; }
.grp .gname { font-size:var(--text-lg); font-weight:900; }
.grp .gcnt { font-size:var(--text-sm); font-weight:700; color:var(--txt-3); }
.grp .ghub { margin-left:auto; font-size:var(--text-xs); font-weight:700; color:var(--blue); text-decoration:none; white-space:nowrap; }
.grp .ghub:hover { text-decoration:underline; }
.grp .rows { padding:0 var(--pad-card) 12px; border-top:var(--bw) solid var(--border); }

/* 1ページ1行。行数が多いので余白は詰める */
.row { display:block; padding:6px 2px; border-bottom:var(--bw) solid var(--border); text-decoration:none; color:var(--ink); }
.row:last-child { border-bottom:none; }
.row:hover { background:#fafbfc; }
.row-top { display:flex; align-items:baseline; gap:10px; }
.row .nm { flex:1; font-size:var(--text-sm); font-weight:700; line-height:1.5; }
.row .nm .hit { background:#fff59d; }
.row .dt { font-size:var(--text-xs); color:var(--txt-3); white-space:nowrap; font-variant-numeric:tabular-nums; }
.row .in { display:block; font-size:var(--text-xs); color:var(--txt-3); margin-top:3px; line-height:1.5; }
.row .in::before { content:"見出し："; }
.row .in .hit { background:#fff59d; }
.row.is-hub .nm::after { content:"まとめ"; font-size:11px; font-weight:700; color:var(--txt-3); border:var(--bw-h) solid var(--border); border-radius:4px; padding:0 6px; margin-left:8px; vertical-align:1px; }
.row[hidden] { display:none; }

.note { font-size:12px; color:var(--txt-3); padding:0 2px; }

@media (max-width:640px) {
  body { font-size:14px; padding:14px 12px 40px; line-height:1.75; }
  :root { --text-xs:11.5px; --text-sm:13.5px; --text-md:14px; --text-lg:16px; --text-xl:18px; --pad-card:14px; --gap-card:11px; }
  .card { padding:14px; border-radius:8px; }
  .grp > summary { padding:12px 14px; }
  .grp .rows { padding:0 14px 10px; }
  .grp .ghub { margin-left:0; width:100%; }
  /* 16px 未満だと iOS が入力時に拡大するので下げない */
  .finder input { font-size:16px; padding:15px 16px 15px 44px; }
  .finder .box svg { left:15px; width:19px; height:19px; }
  .row-top { flex-direction:column; gap:2px; align-items:flex-start; }
}
@media print {
  @page { margin:10mm 9mm; size:A4; }
  body { background:#fff; padding:0; font-size:10.5px; line-height:1.45; }
  .page { display:block; max-width:none; }
  .grp { border:0.5px solid #ccc; margin-bottom:7px; break-inside:auto; }
  .grp > summary::before { display:none; }
  .card:has(.finder), .note { display:none; }
  .row { break-inside:avoid; padding:3px 2px; }
  a { color:inherit; text-decoration:none; }
}
</style>
</head>
<body>
  <script src="assets/site-header.js" defer></script>
  <script src="assets/page-meta.js" defer></script>
  <!-- 見出しの索引。site-header.js も読み込むが、そちらは非同期なので順番を保証するためここでも読む -->
  <script src="assets/search-index.js" defer></script>
<div class="page">

  <div class="page-title-wrap">
    <h1>ページ一覧</h1>
    <p>サイト内のすべてのページを一覧で掲載しています。ページ名や見出しから探せます。</p>
  </div>

  <div class="card">
    <div class="finder">
      <div class="box">
        <input id="q" type="search" placeholder="探したい内容を入力" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </div>
      <div class="chips" id="chips">
        <span class="lab">よく使う検索語</span>
      </div>
      <div class="hint" id="hint">–</div>
    </div>
  </div>

  <div id="groups"></div>

  <p class="note">※ ページを追加すると自動でこの一覧に載ります。ページ名だけでなく、各ページの見出しも検索できます。</p>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var PAGES = window.SITE_PAGES || {};
  var CATS  = window.SITE_CATEGORIES || {};
  var META  = window.__pageMeta || {};
  var INDEX = window.__searchIndex || {};
  var SEP = String.fromCharCode(10); // 見出しを data-k に詰めるときの区切り

  // 表示順。home（トップ・更新履歴・この一覧）はここには出さない
  var ORDER = ['kasan', 'checklist', 'kaitei', 'tools', 'knowledge', 'yakureki', 'jimu'];
  var CHIPS = ['残薬', 'リフィル', '在宅', '選定療養', '高額療養費', '摘要欄', 'ハイリスク', '届出'];

  var buckets = {};
  ORDER.forEach(function (c) { buckets[c] = []; });
  Object.keys(PAGES).forEach(function (path) {
    var info = PAGES[path];
    if (!buckets[info.category]) return;
    buckets[info.category].push({
      path: path,
      title: info.title || path,
      date: (META[path] && META[path].lastUpdated) || '',
      terms: INDEX[path] || [],
      isHub: CATS[info.category] && CATS[info.category].url === path
    });
  });

  // まとめページを先頭に。それ以外は site-header.js の PAGES に書いた順のまま。
  // 更新日順にすると見るたびに位置が変わり、「前は下のほうにあった」で探せなくなるため。
  ORDER.forEach(function (c) {
    buckets[c].sort(function (a, b) {
      if (a.isHub !== b.isHub) return a.isHub ? -1 : 1;
      return 0; // sort は安定なので定義順が保たれる
    });
  });

  var total = 0;
  var html = '';
  ORDER.forEach(function (c) {
    var items = buckets[c];
    if (!items.length) return;
    total += items.length;
    var cat = CATS[c] || { name: c, url: '' };
    html += '<details class="grp" data-group="' + c + '">';
    html += '<summary>' +
            '<span class="gname">' + esc(cat.name) + '</span>' +
            '<span class="gcnt"><span class="cnt">' + items.length + '</span>件</span>' +
            (cat.url ? '<a class="ghub" href="' + encodeURI(cat.url) + '">まとめページへ ›</a>' : '') +
            '</summary>';
    html += '<div class="rows">';
    items.forEach(function (it) {
      html += '<a class="row' + (it.isHub ? ' is-hub' : '') + '" href="' + encodeURI(it.path) + '"' +
              ' data-t="' + esc(it.title) + '" data-k="' + esc(it.terms.join(SEP)) + '">' +
              '<span class="row-top">' +
                '<span class="nm">' + esc(it.title) + '</span>' +
                '<span class="dt">' + (it.date ? esc(it.date) : '') + '</span>' +
              '</span>' +
              '</a>';
    });
    html += '</div></details>';
  });

  document.getElementById('groups').innerHTML = html;

  // よく使う言葉のボタン
  var chipWrap = document.getElementById('chips');
  CHIPS.forEach(function (w) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = w;
    b.addEventListener('click', function () {
      q.value = (q.value.trim() === w) ? '' : w;
      apply();
      syncChips();
      q.focus();
    });
    chipWrap.appendChild(b);
  });

  var q = document.getElementById('q');
  var hint = document.getElementById('hint');
  var rows = Array.prototype.slice.call(document.querySelectorAll('.row'));
  var grps = Array.prototype.slice.call(document.querySelectorAll('.grp'));

  function apply() {
    var kw = q.value.trim().toLowerCase();
    var shown = 0;

    rows.forEach(function (r) {
      var t = r.getAttribute('data-t');
      var terms = (r.getAttribute('data-k') || '').split(SEP).filter(Boolean);
      var inTitle = kw && t.toLowerCase().indexOf(kw) !== -1;
      var inTerm = '';
      if (kw && !inTitle) {
        for (var i = 0; i < terms.length; i++) {
          if (terms[i].toLowerCase().indexOf(kw) !== -1) { inTerm = terms[i]; break; }
        }
      }
      var hit = !kw || inTitle || !!inTerm;
      r.hidden = !hit;
      if (hit) shown++;

      r.querySelector('.nm').innerHTML = inTitle ? mark(t, kw) : esc(t);
      var old = r.querySelector('.in');
      if (old) old.remove();
      if (inTerm) {
        var s = document.createElement('span');
        s.className = 'in';
        s.innerHTML = mark(inTerm, kw);
        r.appendChild(s);
      }
    });

    grps.forEach(function (g) {
      var n = g.querySelectorAll('.row:not([hidden])').length;
      g.hidden = n === 0;
      g.querySelector('.cnt').textContent = n;
      // 絞り込み中は自動で開き、空にしたら畳む
      g.open = !!kw && n > 0;
    });

    var openable = grps.filter(function (g) { return !g.hidden; }).length;
    if (!kw) {
      hint.innerHTML = '全 <b>' + total + '</b> ページ。検索するか、カテゴリーを開いて探してください（開くのは一度にひとつです）。';
    } else if (shown) {
      hint.innerHTML = '<b>' + shown + '</b> ページ見つかりました（' + openable + ' カテゴリー）';
    } else {
      hint.innerHTML = '該当するページはありませんでした。ページ名だけでなく、ページ内の見出しも検索対象です。';
    }
  }

  function mark(text, kw) {
    var i = text.toLowerCase().indexOf(kw);
    if (i === -1) return esc(text);
    return esc(text.slice(0, i)) + '<span class="hit">' + esc(text.slice(i, i + kw.length)) + '</span>' + esc(text.slice(i + kw.length));
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ── カテゴリーは一度にひとつだけ開く ──
  // 全部開くと86ページ・画面7個分の縦長になって、下まで見る気が起きないため。
  // 検索中は絞り込み結果を全部見せたいので、この制御はかけない。
  grps.forEach(function (g) {
    g.addEventListener('toggle', function () {
      if (!g.open || q.value.trim()) return;
      grps.forEach(function (other) { if (other !== g) other.open = false; });
      // 閉じた分だけ上に詰まるので、開いたカテゴリーを画面の上に置き直す
      g.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
  });

  q.addEventListener('input', function () {
    apply();
    syncChips();
  });

  function syncChips() {
    var v = q.value.trim();
    Array.prototype.forEach.call(chipWrap.querySelectorAll('.chip'), function (b) {
      b.classList.toggle('on', b.textContent === v);
    });
  }

  // ?q=… で開いたときは最初から絞り込んだ状態にする
  var pre = new URLSearchParams(location.search).get('q');
  if (pre) q.value = pre;
  apply();
  syncChips();
});
</script>

<script data-goatcounter="https://kimura-chozai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
