<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漢方薬 投薬前の早見表</title>
  <meta name="search-keywords" content="漢方,ツムラ,服薬指導,説明,言い換え,構成生薬,甘草,偽アルドステロン症,抑肝散,葛根湯,芍薬甘草湯,六君子湯,大建中湯,加味逍遙散,補中益気湯,麻子仁丸,五苓散,葛根湯加川芎辛夷,八味地黄丸,柴胡加竜骨牡蛎湯,半夏瀉心湯,半夏厚朴湯,小青竜湯,防已黄耆湯,当帰芍薬散,桂枝茯苓丸,麻黄湯,麦門冬湯,呉茱萸湯,釣藤散,十全大補湯,桂枝加芍薬湯,防風通聖散,酸棗仁湯,牛車腎気丸,人参養栄湯,加味帰脾湯,附子,大黄,麻黄" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/fold.css" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    :root {
      --text-xs:13px; --text-sm:15px; --text-md:16px; --text-lg:18px; --text-xl:22px;
      --pad-card:22px; --gap-card:16px;
      --blue:#1e5fa8; --ink:#222222;
      --bg:#f3f4f6; --white:#ffffff;
      --box-blue:#e4f0f8; --box-gray:#f2f2f2;
      --border:#d1d5db; --border-dk:#9ca3af;
      --radius:10px; --radius-sm:6px; --bw:0.5px; --bw-h:1px;
      --txt-2:#444444; --txt-3:#5e6470;
      /* 注意の印（禁忌・麻黄・大黄・山梔子など）＝クリーム。甘草量など目安の印＝グレー */
      --caution-bg:#f3e8d0; --caution-tx:#7a5718;
    }
    body { font-family:"Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); font-size:var(--text-md); line-height:1.8; padding:32px 16px 60px; }
    .page { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:var(--gap-card); }
    [hidden] { display:none !important; }
    [id] { scroll-margin-top:calc(var(--sn-header-h, 0px) + 70px); }

    .page-title h1 { font-size:var(--text-xl); font-weight:900; letter-spacing:-0.01em; }
    .page-title p  { font-size:var(--text-sm); font-weight:500; color:var(--txt-2); margin-top:4px; }

    .card { background:var(--white); border:var(--bw) solid var(--border); border-radius:var(--radius); padding:var(--pad-card); }
    .card-title { font-size:var(--text-lg); font-weight:900; border-bottom:var(--bw-h) solid var(--border-dk); padding-bottom:8px; margin-bottom:14px; display:flex; align-items:baseline; gap:11px; flex-wrap:wrap; }
    .card-title::before { content:""; width:4px; height:1.05em; border-radius:2px; background:var(--blue); flex-shrink:0; align-self:center; }
    .sub-title { font-weight:900; font-size:var(--text-md); display:flex; align-items:center; gap:9px; margin:16px 0 8px; }
    .sub-title::before { content:""; width:9px; height:9px; border-radius:2px; background:var(--blue); flex-shrink:0; }
    .marker { background:linear-gradient(transparent 62%, #fff59d 62%); font-weight:700; }


    /* 検索（入力欄だけを画面上部に貼り付ける） */
    .search-wrap { position:sticky; top:var(--sn-header-h, 0px); z-index:5; background:var(--bg); padding:6px 0; }
    .search-input { width:100%; font-size:var(--text-md); font-family:inherit; padding:11px 14px; border:var(--bw-h) solid var(--border-dk); border-radius:var(--radius-sm); background:var(--white); }
    .search-input::placeholder { color:#6b7280; }
    .search-input:focus { outline:none; border-color:var(--blue); }
    .finder { margin-top:-6px; }
    .finder .row-lab { font-size:var(--text-xs); font-weight:700; color:var(--txt-3); margin:6px 0 4px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { font-family:inherit; font-size:var(--text-xs); font-weight:700; padding:3px 11px; background:var(--white); color:var(--txt-2); border:var(--bw-h) solid var(--border); border-radius:999px; cursor:pointer; text-decoration:none; }
    .chip.on { background:var(--box-blue); color:var(--blue); border-color:var(--blue); }
    .row-note { font-weight:500; margin-left:4px; }
    /* 使用目標（効能・効果の前段）。体質の話なので患者本人には言わない */
    .hito { margin-top:4px; background:var(--box-gray); border-radius:var(--radius-sm); padding:9px 13px; font-size:var(--text-sm); }
    .hito-l { display:block; font-size:var(--text-xs); font-weight:700; color:var(--txt-2); }
    .hito-n { margin-top:3px; font-size:var(--text-xs); color:var(--txt-3); }
    .hit-count { font-size:var(--text-xs); color:var(--txt-3); margin-top:6px; }

    /* 1品目＝帯（名前と一言）を押すと開く。品目が増えても一覧が縦に伸びすぎないように */
    #list { display:flex; flex-direction:column; gap:8px; }
    details.kp > summary { align-items:center; }
    .kp-sum { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .kp-sum .nm { display:flex; align-items:baseline; gap:0 8px; flex-wrap:wrap; font-size:var(--text-md); font-weight:900; }
    .kp-sum .sgist { font-size:var(--text-xs); font-weight:500; color:var(--txt-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    details.kp[open] .kp-sum .sgist { white-space:normal; }
    /* スマホでは一覧の帯に読みを出さない（名前が長いと2行目に落ちて帯が伸びる）。開いたときと検索では使える */
    @media (max-width:640px) { details.kp:not([open]) .kp-sum .yomi { display:none; } }
    /* 他社品の注意・甘草の合計 */
    .maker-note { font-size:var(--text-xs); color:var(--txt-3); margin-top:4px; }
    .notice { font-size:var(--text-sm); background:var(--caution-bg); color:var(--caution-tx); border-radius:var(--radius-sm); padding:8px 12px; margin-top:6px; }
    .kz-btn { font-family:inherit; font-size:var(--text-xs); font-weight:700; color:var(--blue); background:var(--white); border:var(--bw-h) solid var(--blue); border-radius:999px; padding:2px 12px; cursor:pointer; margin-left:auto; }
    .kz-btn.on { background:var(--box-blue); }
    .kz-bar { margin-top:6px; background:var(--white); border:var(--bw-h) solid var(--blue); border-radius:var(--radius-sm); padding:8px 12px; font-size:var(--text-sm); }
    .kz-bar .sum { font-weight:900; color:var(--blue); }
    .kz-bar .parts { color:var(--txt-2); }
    .kz-bar .line { font-size:var(--text-xs); color:var(--txt-3); margin-top:2px; }
    /* 押せるものは、このページの「甘草の合計に足す」と同じ白地＋青枠にする（灰色だと押せると気づかれない） */
    .kz-bar button { font-family:inherit; font-size:var(--text-xs); font-weight:700; color:var(--blue); background:var(--white); border:var(--bw-h) solid var(--blue); border-radius:999px; padding:1px 10px; cursor:pointer; margin-left:6px; }
    .kp-sum .flags { margin-top:2px; }
    .scene.hit { background:var(--box-blue); margin:0 -10px; padding-left:10px; padding-right:10px; border-radius:var(--radius-sm); }
    /* 検索で当たった所：文は普通の太さにし、当たった語だけ黒の太字にする（場面・効能・効果どれも同じ見せ方） */
    .kp-sum .hits { font-size:var(--text-xs); font-weight:500; color:var(--txt-2); margin-top:2px; }
    .kp-sum .hits.weak { color:var(--txt-3); }
    .kp-sum .hits b { color:var(--ink); font-weight:900; }
    .empty { font-size:var(--text-sm); color:var(--txt-2); padding:10px 2px; }
    /* 1品目のカード */
    .kp-sum .no { font-size:var(--text-sm); font-weight:700; color:var(--blue); background:var(--box-blue); border-radius:4px; padding:0 8px; }
    .kp-sum .yomi { font-size:var(--text-sm); font-weight:500; color:var(--txt-3); }
    /* 1包の量（ピッキング・入力の確認用）。2.5g以外は注意の印と同じクリームにする */
    .kp-sum .pkg { font-size:var(--text-sm); font-weight:700; color:var(--txt-2); }
    .kp-sum .pkg.odd { font-size:var(--text-xs); background:var(--caution-bg); color:var(--caution-tx); border-radius:4px; padding:0 8px; }
    .gist { font-weight:700; }
    .lab-s { font-size:var(--text-xs); font-weight:700; color:var(--txt-3); margin-right:6px; }

    .flags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .flag { font-size:var(--text-xs); font-weight:700; background:var(--box-gray); color:var(--txt-2); border-radius:4px; padding:1px 9px; }
    .flag.warn { background:var(--caution-bg); color:var(--caution-tx); }

    /* 場面ごとの伝え方 */
    /* 場面名を小さなラベルにして、言い換えは次の行に置く（同じ行に続けるとラベルと本文の境目が見えにくかった） */
    .scenes { margin-top:12px; }
    .scene { padding:8px 0; border-bottom:var(--bw-h) solid var(--border); font-size:var(--text-sm); }
    .scene:first-child { padding-top:0; }
    .scene:last-child { border-bottom:none; padding-bottom:0; }
    .scene .sh { display:inline; font-size:var(--text-xs); font-weight:700; color:var(--txt-2); background:var(--box-gray); border-radius:4px; padding:1px 8px; margin-right:6px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
    .scene.hit .sh { background:var(--white); }
    .scene .off { font-size:var(--text-xs); font-weight:700; color:var(--txt-2); background:var(--box-gray); border:var(--bw) solid var(--border); border-radius:4px; padding:0 7px; margin:0 6px 0 -2px; }
    .scene .words { display:block; margin-top:3px; color:var(--blue); font-weight:700; }
    .scene .tip { margin-top:1px; font-size:var(--text-sm); color:var(--txt-2); }

    /* 構成生薬 */
    .herbs { width:100%; border-collapse:collapse; font-size:var(--text-sm); }
    .herbs th { font-size:var(--text-xs); font-weight:700; color:var(--txt-3); text-align:left; padding:2px 8px 4px; border-bottom:var(--bw-h) solid var(--border-dk); }
    .herbs th.hg { text-align:right; white-space:nowrap; }
    .herbs td { padding:6px 8px; border-bottom:var(--bw-h) solid var(--border); vertical-align:top; }
    .herbs tr:last-child td { border-bottom:none; }
    .herbs td.hn { white-space:nowrap; font-weight:700; width:1%; }
    .herbs td.hn small { display:block; font-size:var(--text-xs); font-weight:500; color:var(--txt-3); }
    .herbs td.hg { white-space:nowrap; text-align:right; color:var(--txt-2); width:1%; }
    /* 中心になる生薬／そのほか の見出しの行 */
    .herbs tr.grp td { font-size:var(--text-sm); font-weight:700; color:var(--ink); padding:14px 8px 4px; border-bottom:var(--bw-h) solid var(--border-dk); }
    .herbs tbody tr.grp:first-child td { padding-top:6px; }
    /* 生薬名を押すと、その生薬のほかの働きを行の下に出す。このページの「押せるもの」（甘草の合計に足す 等）と同じ白地＋青枠にする。
       読み仮名を押しても開くように、名前の欄全体を押せるようにしている */
    .herbs td.hn:has(.hbtn) { cursor:pointer; }
    .hbtn { font:inherit; font-weight:700; color:var(--blue); background:var(--white); border:var(--bw-h) solid var(--blue); border-radius:var(--radius-sm); padding:3px 10px; cursor:pointer; text-align:left; }
    .hbtn.on { background:var(--box-blue); }
    .herbs tr.hall td { background:var(--box-gray); font-size:var(--text-xs); color:var(--txt-2); padding:6px 10px 7px; }
    .herbs tr.hall b { color:var(--ink); }
    .how { font-size:var(--text-sm); }

    .cautions { list-style:none; font-size:var(--text-sm); }
    .cautions li { display:flex; gap:6px; }
    .cautions li::before { content:"・"; color:#999; flex-shrink:0; }
    /* 注意事項の中で処方名を押したときの比べる表は、文の横ではなく下の行に出す（li が横並びのため） */
    .cautions li { flex-wrap:wrap; }
    .cautions li > span { flex:1 1 0; min-width:0; }
    .cautions li > .cmp { flex:0 0 calc(100% - 1em - 6px); margin-left:calc(1em + 6px); }
    .kounou { font-size:var(--text-sm); color:var(--txt-2); }
    .watch-lead { font-size:var(--text-sm); color:var(--txt-2); margin-bottom:4px; }
    .watch { list-style:none; font-size:var(--text-sm); }
    .watch li { display:flex; gap:10px; padding:3px 0; }
    .watch .wl { flex-shrink:0; min-width:4.5em; font-size:var(--text-xs); font-weight:700; color:var(--txt-2); padding-top:2px; }
    /* 開いた品目の中の小見出し。区切りの線を上に引き、本文と見分けやすくする */
    .fold-body .sub-title { margin:18px 0 8px; padding-top:14px; border-top:var(--bw-h) solid var(--border); }
    /* 補足は入りきらなければ次の行へ回す（見出しの文字が1字ずつ折り返されないように） */
    .sub-title { flex-wrap:wrap; row-gap:0; }
    .sub-title .st-note { font-size:var(--text-xs); font-weight:500; color:var(--txt-3); }
    @media (max-width:640px) { .sub-title .st-note { flex-basis:100%; padding-left:18px; } }

    /* 説明の中の処方名（押すと比べる表が開く） */
    .ref { font:inherit; font-weight:700; color:var(--blue); background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
    .ref::after { content:"⇄"; font-size:0.8em; margin-left:2px; text-decoration:none; display:inline-block; }
    .cmp { margin:8px 0 4px; background:var(--white); border:var(--bw-h) solid var(--border-dk); border-radius:var(--radius-sm); padding:10px 12px; font-size:var(--text-sm); color:var(--ink); font-weight:400; }
    .cmp-h { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    .cmp-h b { font-weight:900; }
    .cmp-g { font-size:var(--text-xs); color:var(--txt-2); margin:2px 0 6px; }
    .cmp-x, .cmp-open { font-family:inherit; font-size:var(--text-xs); font-weight:700; cursor:pointer; border-radius:999px; padding:1px 11px; }
    .cmp-x { margin-left:auto; color:var(--txt-2); background:var(--box-gray); border:var(--bw) solid var(--border); }
    .cmp-open { margin-left:auto; color:var(--blue); background:var(--white); border:var(--bw-h) solid var(--blue); }
    .cmp-t { max-width:560px; }
    .cmp-t th.hg { text-align:right; white-space:normal; max-width:8em; line-height:1.4; }
    .cmp-t td { padding-top:4px; padding-bottom:4px; }
    .cmp-t td.hg.diff { font-weight:900; color:var(--ink); }
    .cmp-t .none { color:var(--txt-3); }
    .ctag { font-size:var(--text-xs); font-weight:700; border-radius:4px; padding:0 6px; margin-left:6px; }
    .ctag.self  { background:#f3e8d0; color:#7a5718; }   /* クリーム */
    .ctag.other { background:#e5e0f2; color:#4b3f80; }   /* 藤 */
    .cmp-f { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:var(--text-xs); color:var(--txt-3); margin-top:6px; }

    .table-wrap { overflow-x:auto; }
    .src { font-size:var(--text-xs); color:var(--txt-3); margin-top:8px; }
    .src a { color:var(--blue); }

    @media (max-width:640px) {
      body { font-size:14px; padding:14px 12px 40px; line-height:1.75; }
      :root { --text-xs:11.5px; --text-sm:13.5px; --text-md:14px; --text-lg:16px; --text-xl:18px; --pad-card:14px; --gap-card:11px; }
      .herbs td, .herbs th { padding-left:4px; padding-right:4px; }
    }
    @media print {
      .search-wrap, .finder { display:none; }
      .card { break-inside:avoid; }
    }
  </style>
</head>
<body>
<script src="../assets/site-header.js" defer></script>
<div class="page">

  <div class="page-title">
    <h1>漢方薬 投薬前の早見表</h1>
  </div>

  <div class="search-wrap">
    <input id="q" class="search-input" type="search" placeholder="例）抑肝散　54　不眠　精神科" autocomplete="off" />
    <div class="notice" id="maker" hidden>クラシエなど他社品は、番号も分量もツムラと違う。処方名で探し、分量は製品の添付文書で確かめる。</div>
    <div class="kz-bar" id="kzbar" hidden></div>
  </div>
  <div class="finder">
    <div class="row-lab">症状から探す<span class="row-note">（ボタンにない症状は検索欄に入力）</span></div>
    <div class="chips" id="chips"></div>
    <div class="hit-count" id="hit"></div>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty" hidden>当てはまる品目がない。言葉を短くするか、別の言い方で探す。漢方名・ツムラ番号でも探せる。</p>

  <div class="card" data-toc="skip">
    <div class="card-title">補足</div>
    <ul class="cautions">
      <li>漢方でも、肝機能障害などの重大な副作用はある。長く服用している人がだるさ・食欲不振を訴えたときは、漢方も原因の候補に入れて処方医に伝える。</li>
    </ul>
    <p class="src">出典：各製剤の添付文書（PMDA 医療用医薬品情報、2026年10月12日・14日取得）</p>
  </div>

</div>

<script src="data-kampo.js"></script>
<script src="data-kampo-herbs.js"></script>
<script>
const KAMPO = window.KAMPO;

/* 絞り込みの入口（症状） */


const kana = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = s => kana((s || '').toLowerCase().normalize('NFKC'));
/* 入力の表記ゆれ（本文の表記に寄せる）。「54番」「TJ-54」は番号として扱う */
const VARIANTS = [[/牡蠣/g,'牡蛎'],[/龍/g,'竜'],[/逍遥/g,'逍遙'],[/防己/g,'防已'],[/付子/g,'附子'],[/子供|こども/g,'子ども'],[/生理/g,'月経'],[/耳なり/g,'耳鳴り']];
/* 「耳の症状で使う漢方」「せきに効く薬」のような文で探されたら、症状の言葉だけを残す
   （文のまま探すと、本文に同じ並びがないので0件になる）。「芍薬」を壊さないよう、薬は「の薬」「くすり」のときだけ外す */
const cleanTerm = t => {
  let s = t.replace(/漢方薬?|症状/g, '').replace(/の薬$|のくすり$|くすり$/, '');
  s = s.replace(/(?:に|で|へ)?(?:使う|使える|つかう|効く|きく|よい|いい)(?:薬|くすり|もの)?$/, '');
  if (s.length >= 2) s = s.replace(/[のにでがはをへ]$/, '');
  if (s.length >= 3) s = s.replace(/(?:時|とき)$/, '');  /* 眠れない時の漢方 → 眠れない */
  return s;
};
const normTerm = t => {
  const m = t.match(/^(?:tj-?|つむら)?(\d+)番?$/);
  if (m) return m[1];
  return VARIANTS.reduce((s, [a, b]) => s.replace(a, norm(b)), cleanTerm(t));
};
const strip = s => s.replace(/<[^>]+>/g, '');
const MAKERS = ['くらしえ','kracie','こたろー'].map(norm);
const SELF = ['つむら','tsumura'];  /* ツムラは探す語から外すだけ */
/* 括りのボタン。手で品目を選んだ一覧ではなく、括りの言葉で全品目の本文（名前・一言・効能・場面・キーワード）を探す。
   生薬の役割と注意書きは探さない（「胃腸を守る」「むくみ（副作用）」でほぼ全品目に当たるため） */
const CATS = [
  ['こころ・眠り', ['イライラ','不安','不眠','眠れない','メンタル','神経症','神経過敏','夜泣き','気分がふさ']],
  ['胃腸・お通じ', ['胃','食欲','吐き気','嘔吐','下痢','便秘','腹痛','おなか','胸やけ','消化']],
  ['かぜ・せき・鼻', ['かぜ','感冒','インフルエンザ','せき','痰','ぜんそく','のど','鼻','扁桃']],
  ['痛み・しびれ', ['頭痛','関節痛','神経痛','腰痛','筋肉痛','肩こり','しびれ','こむらがえり','五十肩','打撲']],
  ['女性の不調', ['月経','更年期','血の道','産後','つわり','おりもの','こしけ']],
  ['皮膚', ['湿疹','かゆみ','にきび','じんましん','皮膚','しもやけ','化膿','あせも']],
  ['尿・むくみ', ['排尿','頻尿','残尿','尿量','むくみ','浮腫','夜尿']],
  ['疲れ・冷え', ['疲れ','倦怠','だるさ','虚弱','冷え','夏バテ','病後']],
].map(([label, words]) => ({ label, words: words.map(norm) }));
let cat = -1;

/* 説明の中に出てくる別の処方名を、押すと生薬を見比べられるボタンにする（比べる相手が画面にないと「〜に○○を加えた形」が読めないため）。
   長い名前から先に探す（「葛根湯加川芎辛夷」の中の「葛根湯」を拾わないように）。1つの文の中では最初の1回だけ */
const BYNAME = {}; KAMPO.forEach(k => { BYNAME[k.name] = k; });
const NAMES = Object.keys(BYNAME).sort((a, b) => b.length - a.length);
function linkNames(html, self){
  const tags = [], ph = [];
  let s = html.replace(/<[^>]+>/g, t => `\u0001${tags.push(t) - 1}\u0002`);
  NAMES.forEach(nm => { if (s.includes(nm)) s = s.split(nm).join(`\u0003${ph.push(nm) - 1}\u0004`); });
  const seen = new Set();
  s = s.replace(/\u0003(\d+)\u0004/g, (m, i) => {
    const nm = ph[i];
    if (nm === self.name || seen.has(nm)) return nm;
    seen.add(nm);
    return `<button type="button" class="ref" data-to="${BYNAME[nm].id}">${nm}</button>`;
  });
  return s.replace(/\u0001(\d+)\u0002/g, (m, i) => tags[i]);
}
/* 比べる表：両方に入る生薬 → この処方だけ → 相手だけ の順。量が違う行は量を太字にする */
function compare(self, other){
  const amt = (k, nm) => { const h = k.herbs.find(h => h[1] === nm); return h ? h[2] : null; };
  const all = [...self.herbs.map(h => h[1]), ...other.herbs.map(h => h[1]).filter(nm => !amt(self, nm))];
  const rows = all.map(nm => ({ nm, a: amt(self, nm), b: amt(other, nm) }));
  const kind = r => r.a == null ? 2 : r.b == null ? 1 : 0;
  rows.sort((x, y) => kind(x) - kind(y));
  const g = v => v == null ? '<span class="none">－</span>' : v.toFixed(1) + 'g';
  const body = rows.map(r => {
    const k = kind(r), diff = k === 0 && r.a !== r.b;
    const tag = k === 1 ? '<span class="ctag self">こちらだけ</span>' : k === 2 ? '<span class="ctag other">相手だけ</span>' : '';
    return `<tr class="c${k}"><td class="hn">${r.nm}${tag}</td><td class="hg${diff ? ' diff' : ''}">${g(r.a)}</td><td class="hg${diff ? ' diff' : ''}">${g(r.b)}</td></tr>`;
  }).join('');
  const n = [0, 1, 2].map(k => rows.filter(r => kind(r) === k).length);
  return `<div class="cmp" data-to="${other.id}">
    <div class="cmp-h"><span>比べる相手：<b>${other.name}</b>（ツムラ ${other.no}）</span><button type="button" class="cmp-x">閉じる</button></div>
    <div class="cmp-g">${other.gist}</div>
    <div class="table-wrap"><table class="herbs cmp-t">
      <thead><tr><th>生薬</th><th class="hg">${self.name}</th><th class="hg">${other.name}</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <div class="cmp-f">共通 ${n[0]}・こちらだけ ${n[1]}・相手だけ ${n[2]}<button type="button" class="cmp-open" data-to="${other.id}">${other.name}を開く</button></div>
  </div>`;
}

/* 長期服用時の確認事項。含む生薬と、注意事項（添付文書の重大な副作用）から作る。
   聞き取りで分かり、実務で確かめるものだけにする（肝機能は採血で見るもので、漢方で聞き取るのはまれ。2026-10-20 本人）
   品目ごとに手で書くと書き方がばらつくため（2026-10-19 読者係3人の指摘） */
const WATCH = [
  { by: k => /偽アルドステロン症/.test(own(k)), lab: '甘草', t: 'むくみ・血圧の上昇・手足のだるさや力の入りにくさ（偽アルドステロン症・低カリウム血症の初めの症状のことがある）' },
  { by: k => k.herbs.some(h => h[1] === '麻黄'), lab: '麻黄', t: '動悸・眠れない・尿が出にくい' },
  { by: k => k.herbs.some(h => h[1] === '附子末'), lab: '附子', t: 'のぼせ・動悸・舌のしびれ' },
  { by: k => k.herbs.some(h => ['大黄','芒硝','無水芒硝'].includes(h[1])), lab: '大黄・芒硝', t: '下痢・腹痛が続いていないか' },
  { by: k => k.herbs.some(h => h[1] === '山梔子'), lab: '山梔子', t: '腹痛・下痢・便秘・おなかの張りが続いていないか（多くは5年以上の服用で腸間膜静脈硬化症）' },
  { by: k => /間質性肺炎/.test(own(k)), lab: '肺', t: 'せき・息切れ・発熱。出たらすぐ連絡してもらう（間質性肺炎）' },
];
/* 判定に使う注意書き。「似た処方の小柴胡湯で…の報告」の文は、その品目自体の副作用ではないので外す（柴陥湯） */
const own = k => k.cautions.filter(c => !/似た処方|類似処方/.test(c)).join('');
function watch(k){
  const w = WATCH.filter(r => r.by(k));
  if (!w.length) return '';
  return `<div class="sub-title">長期服用時の確認事項</div>
    <p class="watch-lead">聞き取りで確認し、該当する症状の訴えがあれば処方医に伝える。</p>
    <ul class="watch">${w.map(r => `<li><span class="wl">${r.lab}</span><span>${r.t}</span></li>`).join('')}</ul>`;
}

/* 誤解されやすい漢方の言い方。その品目の生薬の役割に出てくるときだけ、表のすぐ下に注を出す */
const TERMS = [
  [/熱を冷ま/, '「熱を冷ます」は体温を下げる意味ではなく、のぼせ・ほてり・炎症の熱のこと。'],
  [/血を補/, '「血を補う」は漢方の言い方で、鉄剤のように血液を増やす意味ではない。'],
];
function termNote(k){
  const roles = k.how + k.herbs.map(h => h[3]).join('');
  const ns = TERMS.filter(([re]) => re.test(roles)).map(([, t]) => t);
  return ns.length ? `<p class="maker-note">${ns.join('')}患者に伝えるときは言い方に気をつける。</p>` : '';
}

/* 顆粒の1日量の印には1日の包数を添える（大建中湯は1包2.5gで1日15g＝6包。量だけだと1包の量と合わないように見えるため） */
const flagText = (k, f) => { const m = f.t.match(/1日量([\d.]+)g/); return m ? `${f.t}（${Math.round(parseFloat(m[1]) / k.pkg)}包）` : f.t; };

function card(k){
  const scenes = k.scenes.map(s =>
    `<div class="scene"><span class="sh">${s.t}</span>${s.off ? '<span class="off">効能外</span>' : ''}<span class="words">${s.w}</span>
      ${s.tip ? `<div class="tip">${linkNames(s.tip, k)}</div>` : ''}</div>`).join('');
  /* 中心になる生薬を上にまとめ、見出しの行で「そのほか」と分ける（色の凡例を読まなくても分かるように） */
  const row = h => `<tr><td class="hn"><button type="button" class="hbtn" data-h="${h[1]}">${h[1]}</button><small>${h[0]}</small></td><td>${h[3]}</td><td class="hg">${h[2].toFixed(1)}g</td></tr>`;
  const keyH = k.herbs.filter(h => h[4]), restH = k.herbs.filter(h => !h[4]);
  const herbs = `<tr class="grp"><td colspan="3">中心になる生薬</td></tr>${keyH.map(row).join('')}`
    + (restH.length ? `<tr class="grp"><td colspan="3">そのほか</td></tr>${restH.map(row).join('')}` : '');
  const kz = k.kanzo ? `<span class="flag">甘草 ${k.kanzo.toFixed(1)}g/日</span>` : '<span class="flag">甘草なし</span>';
  const cautions = k.cautions.map(c => `<li><span>${linkNames(c, k)}</span></li>`).join('');
  const warn = k.flags.filter(f => f.warn).map(f => `<span class="flag warn">${flagText(k, f)}</span>`).join('');
  const plain = k.flags.filter(f => !f.warn).map(f => `<span class="flag">${flagText(k, f)}</span>`).join('');
  return `<details class="fold kp" id="${k.id}">
    <summary><div class="kp-sum">
      <div class="nm"><span class="no">ツムラ ${k.no}</span>${k.name}<span class="pkg${k.pkg !== 2.5 ? ' odd' : ''}">1包 ${k.pkg.toFixed(1)}g</span><span class="yomi">${k.yomi}</span></div>
      <div class="sgist">${k.gist}</div>
      ${warn ? `<div class="flags">${warn}</div>` : ''}
      <div class="hits" hidden></div>
    </div></summary>
    <div class="fold-body">
    <div class="flags" style="margin-top:0">${kz}${plain}<span class="flag">味：${k.taste}</span>${k.kanzo ? `<button type="button" class="kz-btn" data-id="${k.id}">甘草の合計に足す</button>` : ''}</div>

    ${k.hito ? `<div class="hito"><span class="hito-l">使用目標</span>${k.hito}</div>` : ''}
    <div class="sub-title">場面ごとの伝え方<span class="st-note">青字は言い換えに迷ったときの手がかり。訴えと処方医の意図に合わせて選ぶ</span></div>
    <div class="scenes">${scenes}</div>
    ${k.scenes.some(s => s.off) ? '<p class="maker-note">「効能外」は、その症状・病名が添付文書の効能・効果にない使い方。</p>' : ''}

    ${watch(k)}

    <div class="sub-title">構成生薬と役割<span class="st-note">生薬名を押すと、その生薬のおもな働きを表示</span></div>
    <div class="table-wrap"><table class="herbs">
      <thead><tr><th>生薬</th><th>この処方での役割</th><th class="hg">生薬量</th></tr></thead>
      <tbody>${herbs}</tbody></table></div>
    <p class="maker-note">分量はツムラの製品。クラシエなど他社品は、同じ処方名でも分量や生薬が違うことがある。役割は添付文書に書かれていないため、漢方の一般的な解釈で、この処方の中で効かせている働きだけを載せた。</p>
    ${termNote(k)}

    <div class="sub-title">処方の組み立て</div>
    <p class="how">${linkNames(k.how, k)}</p>

    <div class="sub-title">注意事項</div>
    <ul class="cautions">${cautions}</ul>

    <div class="sub-title">効能・効果<span class="st-note">添付文書</span></div>
    <p class="kounou">${k.kounou}</p>
    <p class="src">添付文書：<a href="https://www.pmda.go.jp/PmdaSearch/iyakuDetail/ResultDataSetPDF/${k.pmda}" target="_blank" rel="noopener">ツムラ${k.name}エキス顆粒（医療用）</a></p>
    </div>
  </details>`;
}

const list = document.getElementById('list');
list.innerHTML = KAMPO.map(card).join('');
const items = [...list.querySelectorAll('details.kp')];

/* 1つ開いたら他は閉じる（スマホで開いたものが積み重なって長くならないように）。開いた品目の頭へ合わせる */
items.forEach(d => d.addEventListener('toggle', () => {
  if (!d.open) return;
  items.forEach(o => { if (o !== d && o.open) o.open = false; });
  const top = d.getBoundingClientRect().top;
  const head = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sn-header-h')) || 0) + 64;
  if (top < head || top > innerHeight * 0.6) scrollTo({ top: scrollY + top - head, behavior: 'smooth' });
}));
/* 甘草の合計：品目のボタンで足し引きし、検索欄の下に合計を出す */
const kzSel = [];
/* 合計の欄は画面上部に貼り付くので、ふだんは合計と内訳の1行だけにする。注意の2行は「注意」を押したときだけ出す（スマホで画面を占めるため） */
let kzMore = false;
const KZHI = KAMPO.filter(k => k.kanzo >= 2.5).map(k => k.name).join('・');
const kzBar = document.getElementById('kzbar');
function renderKz(){
  document.querySelectorAll('.kz-btn').forEach(b => {
    const on = kzSel.includes(b.dataset.id);
    b.classList.toggle('on', on);
    b.textContent = on ? '合計から外す' : '甘草の合計に足す';
  });
  kzBar.hidden = !kzSel.length;
  if (!kzSel.length) return;
  const ks = kzSel.map(id => KAMPO.find(k => k.id === id));
  const sum = ks.reduce((a, k) => a + k.kanzo, 0);
  kzBar.innerHTML = `甘草の合計 <span class="sum">${sum.toFixed(1)}g/日</span>
    <span class="parts">（${ks.map(k => k.name + ' ' + k.kanzo.toFixed(1)).join('＋')}）</span><button type="button" id="kzclear">すべて外す</button><button type="button" id="kzmore">${kzMore ? '注意を閉じる' : '注意を開く'}</button>
    <div class="line"${kzMore ? '' : ' hidden'}>合計量の公的な目安はない（添付文書は「含有生薬の重複に注意」とするだけ）が、甘草が重なるほど、むくみ・血圧上昇・手足のだるさ（偽アルドステロン症）が出やすくなる。ほかに甘草やグリチルリチンを含む薬（市販薬も）がないかも確認する。</div>
    <div class="line"${kzMore ? '' : ' hidden'}>アルドステロン症などの禁忌があるのは、1品目で甘草を1日2.5g以上含むもの（昭和53年の厚生省通知の基準）：${KZHI}。</div>`;
  document.getElementById('kzclear').onclick = () => { kzSel.length = 0; renderKz(); };
  document.getElementById('kzmore').onclick = () => { kzMore = !kzMore; renderKz(); };
}
/* 処方名のボタン：押した文のすぐ下に比べる表を開く（同じ品目の中では1つだけ）。「○○を開く」で相手の品目へ移る */
list.addEventListener('click', e => {
  const r = e.target.closest('.ref, .cmp-x, .cmp-open'); if (!r) return;
  const d = r.closest('details.kp');
  if (r.classList.contains('cmp-x')) { r.closest('.cmp').remove(); return; }
  if (r.classList.contains('cmp-open')) {
    const t = document.getElementById(r.dataset.to);
    if (t.hidden) { q.value = ''; cat = -1; apply(); }
    t.open = true;
    return;
  }
  const anchor = r.closest('li, .scene') || r.closest('p');
  const old = d.querySelector('.cmp');
  const same = old && old.dataset.to === r.dataset.to && old.parentNode === (anchor.matches('li, .scene') ? anchor : anchor.parentNode);
  if (old) old.remove();
  if (same) return;
  const html = compare(KAMPO.find(k => k.id === d.id), KAMPO.find(k => k.id === r.dataset.to));
  if (anchor.matches('li, .scene')) anchor.insertAdjacentHTML('beforeend', html);
  else anchor.insertAdjacentHTML('afterend', html);
});
list.addEventListener('click', e => {
  const b = e.target.closest('.kz-btn'); if (!b) return;
  const i = kzSel.indexOf(b.dataset.id);
  if (i >= 0) kzSel.splice(i, 1); else kzSel.push(b.dataset.id);
  renderKz();
});
/* 生薬名：その生薬のおもな働きを、行のすぐ下に開く（もう一度押すと閉じる）。
   この処方での役割にすでに書いた働きは外す（同じ文が先に来ると、ほかの働きが読み流されるため） */
list.addEventListener('click', e => {
  const cell = e.target.closest('td.hn'); const b = cell && cell.querySelector('.hbtn'); if (!b) return;
  const tr = b.closest('tr'), nx = tr.nextElementSibling;
  if (nx && nx.classList.contains('hall')) { nx.remove(); b.classList.remove('on'); return; }
  const roles = (window.KAMPO_HERBS || {})[b.dataset.h];
  if (!roles) return;
  const here = tr.children[1].textContent;
  const others = roles.filter(r => !here.includes(r));
  b.classList.add('on');
  tr.insertAdjacentHTML('afterend', `<tr class="hall"><td colspan="3"><b>${b.dataset.h}</b>のおもな働き：${others.length ? others.join('／') : 'この処方での役割と同じ'}</td></tr>`);
});
/* 印刷するときは全部開く */
addEventListener('beforeprint', () => items.forEach(d => d.open = true));

/* 検索用の文字列。HAY＝名前・読み・番号・生薬名・場面・キーワードなど、HAYH＝生薬の役割と「だから効く」、HAYC＝注意事項
   生薬の役割には「胃腸を守る」のような語がほぼ全品目に出るので、そこだけで当たった品目も後ろに回す
   注意書きの語（副作用の「むくみ」、併用注意の「かぜ薬」など）だけで当たった品目は後ろに回し、そうと分かるようにする */
const HAY = {}, HAYH = {}, HAYC = {}, HAYKA = {}, NAME = {};
const isKa = t => /科$/.test(t);
KAMPO.forEach(k => {
  NAME[k.id] = norm(k.name + ' ' + k.yomi);
  HAY[k.id] = norm(strip([k.name, k.yomi, 'ツムラ' + k.no, k.gist, k.kounou, k.kw, k.taste,
    k.herbs.map(h => h[1]).join(' '),  /* カタカナ名は外す（「せき」がカッセキに当たるため） */
    k.scenes.map(s => [s.t, s.w, s.tip || '', s.k].join(' ')).join(' '),
    k.flags.map(f => f.t).join(' '), k.hito || ''].join(' ')));
  /* 診療科は「○○科」と入れたときだけ探す（「耳」「鼻」「皮膚」が耳鼻科・皮膚科に当たり、症状と関係ない品目まで出るため） */
  HAYKA[k.id] = norm(k.scenes.map(s => s.ka).join(' '));
  HAYH[k.id] = norm(strip([k.how, k.herbs.map(h => h[3]).join(' ')].join(' ')));
  HAYC[k.id] = norm(strip(k.cautions.join(' ')));
});

const q = document.getElementById('q');
const hit = document.getElementById('hit');
const empty = document.getElementById('empty');
const chipsEl = document.getElementById('chips');
chipsEl.innerHTML = CATS.map((c, i) => `<button type="button" class="chip" data-i="${i}">${c.label}</button>`).join('');

/* 場面ごとの検索用文字列 */
const SHAY = {};
const SHAYKA = {};
KAMPO.forEach(k => {
  SHAY[k.id] = k.scenes.map(s => norm(strip([s.t, s.w, s.tip || '', s.k].join(' '))));
  SHAYKA[k.id] = k.scenes.map(s => norm(s.ka));
});
/* 番号だけの検索は番号に完全一致させる（「1」で 17 や 100 が出ないように） */
/* 0＝当たらない、1＝注意書き、1.5＝生薬の説明、2＝本文で当たる */
/* 同じ症状の言い方の違い。どれで探しても同じ組の言い方に当たり、帯ではその語を太字にする
   （例：「不眠」で探して場面の名前「眠れない」が太字になる／「咳」で探して本文の「せき」に当たる）。
   意味が近いだけの語（めまい と ふらつき、疲れ と だるさ など）は組にしない。かな2字の語（たん）は別の語に当たるので入れない */
const SYN = [
  ['不眠','眠れない','眠りが浅い','寝つき','寝付き'], ['かぜ','風邪','感冒'], ['イライラ','いらだち','苛立ち'], ['吐き気','はきけ','悪心','嘔気'],
  ['せき','咳','咳嗽'], ['鼻水','鼻汁','はなみず'], ['鼻づまり','鼻閉','鼻詰まり'], ['めまい','眩暈','目まい'],
  ['むくみ','浮腫'], ['かゆみ','痒み','瘙痒','そう痒'], ['だるさ','だるい','倦怠'], ['疲れ','疲労'], ['肩こり','肩凝り'],
  ['こむらがえり','こむら返り','足がつる','足のつり'], ['耳鳴り','耳なり'], ['二日酔い','二日酔'], ['頻尿','尿が近い','トイレが近い'],
  ['頭痛','頭が痛い'], ['腹痛','おなかが痛い','お腹が痛い'], ['便秘','便が出にくい','便が出ない'], ['冷え症','冷え性'],
  ['しびれ','痺れ'], ['にきび','吹き出物','ざ瘡'], ['じんましん','蕁麻疹'], ['あせも','汗疹'], ['食欲不振','食欲がない'], ['ほてり','火照り'],
].map(g => g.map(norm));
const alts = t => SYN.find(g => g.includes(t)) || [t];
function match(k, term){
  if (/^\d+$/.test(term)) return k.no === Number(term) ? 2 : 0;
  if (isKa(term) && HAYKA[k.id].includes(term)) return 2;
  const as = alts(term), has = h => as.some(a => h.includes(a));
  return has(HAY[k.id]) ? 2 : has(HAYH[k.id]) ? 1.5 : has(HAYC[k.id]) ? 1 : 0;
}
/* 当たった語の前後を抜き出す。norm は1字ずつかけて、元の文の位置と対応させる */
const esc = s => s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
function snipLine(label, text, ts){
  text = strip(text || '');
  const map = []; let n = '';
  for (let i = 0; i < text.length; i++) { const c = norm(text[i]); for (let x = 0; x < c.length; x++) map.push(i); n += c; }
  for (const t of ts.flatMap(alts)) {
    const j = n.indexOf(t); if (j < 0) continue;
    const a = map[j], b = map[j + t.length - 1] + 1;
    /* 前後は句読点などの区切りで切る（「…れ声、」のように語の途中から始まらないように） */
    const CUT = /[、。・，,（）()「」：:\s／]/;
    let s = Math.max(0, a - 16), e = Math.min(text.length, b + 18);
    if (s > 0) { let d = s; while (d < a && !CUT.test(text[d])) d++; if (d < a) s = d + 1; while (s < a && /\s/.test(text[s])) s++; }
    if (e < text.length) { let d = e; while (d > b && !CUT.test(text[d])) d--; if (d > b) e = d; }
    return `${label}：${s > 0 ? '…' : ''}${esc(text.slice(s, a))}<b>${esc(text.slice(a, b))}</b>${esc(text.slice(b, e))}${e < text.length ? '…' : ''}`;
  }
  return '';
}
function kwLine(k, ts){
  const ws = (k.kw || '').split(/\s+/).filter(w => w && ts.some(t => alts(t).some(a => norm(w).includes(a))));
  return ws.length ? '関連する語：' + markAll(ws.join('・'), ts) : '';
}
/* 文の中の当たった語をすべて太字にする（場面の名前に使う。検索語が場面の名前になく、検索用の語で当たったときは太字なしのまま） */
function markAll(text, ts){
  const map = []; let n = '';
  for (let i = 0; i < text.length; i++) { const c = norm(text[i]); for (let x = 0; x < c.length; x++) map.push(i); n += c; }
  const on = new Array(text.length).fill(false);
  ts.flatMap(alts).forEach(t => {
    for (let j = n.indexOf(t); t && j >= 0; j = n.indexOf(t, j + 1)) for (let p = map[j]; p <= map[j + t.length - 1]; p++) on[p] = true;
  });
  let out = '';
  for (let i = 0; i < text.length; i++) {
    if (on[i] && !on[i - 1]) out += '<b>';
    out += esc(text[i]);
    if (on[i] && !on[i + 1]) out += '</b>';
  }
  return out;
}
function apply(){
  /* 「漢方」だけ・「の症状」だけのように、言葉を外すと何も残らない語は探す語から除く */
  let terms = norm(q.value).split(/\s+/).filter(Boolean).map(normTerm).filter(Boolean);
  /* 他社名で探されたら、その語（と他社の番号）は外して処方名だけで探し、分量の違いを知らせる */
  terms = terms.filter(t => !SELF.includes(t));
  const maker = terms.some(t => MAKERS.includes(t));
  if (maker) terms = terms.filter(t => !MAKERS.includes(t) && !/^\d+$/.test(t));
  document.getElementById('maker').hidden = !maker;
  const shown = [], rank = {};
  let weakN = 0;
  KAMPO.forEach(k => {
    const lv = terms.map(t => match(k, t));
    const inCat = cat < 0 || CATS[cat].words.some(w => HAY[k.id].includes(w));
    const ok = inCat && lv.every(v => v > 0);
    const cautionOnly = ok && lv.some(v => v === 1);
    const herbOnly = ok && !cautionOnly && lv.some(v => v === 1.5);
    const weak = cautionOnly || herbOnly;
    /* 並び順：名前に当たる → 本文に当たる → 注意書きだけに当たる（同じ段の中はツムラ番号順） */
    rank[k.id] = !ok ? 9 : cautionOnly ? 3 : herbOnly ? 2 : terms.some(t => NAME[k.id].includes(t)) ? 0 : 1;
    document.getElementById(k.id).hidden = !ok;
    if (ok) shown.push(k.id);
    if (ok && weak) weakN++;
    /* 品目名・番号以外の語で当たった場面を帯に出し、中でも色を付ける */
    const sceneTerms = terms.filter(t => !/^\d+$/.test(t) && !norm(k.name + k.yomi).includes(t)).concat(cat < 0 ? [] : CATS[cat].words);
    const hitIdx = sceneTerms.length ? SHAY[k.id].map((h, i) => sceneTerms.some(t => isKa(t) ? SHAYKA[k.id][i].includes(t) : alts(t).some(a => h.includes(a))) ? i : -1).filter(i => i >= 0) : [];
    const el = document.getElementById(k.id);
    el.querySelectorAll('.scene').forEach((d, i) => d.classList.toggle('hit', hitIdx.includes(i)));
    const hb = el.querySelector('.hits');
    /* 場面以外（効能・効果など）で当たったときは、当たった所を短く抜き出す（開かなくても、なぜ出たのか分かるように）。
       一言の説明は帯に見えているので抜き出さない */
    const qTerms = sceneTerms.filter(t => terms.includes(t));
    const inGist = qTerms.some(t => norm(strip(k.gist)).includes(t));
    const html = !ok ? ''
      : cautionOnly ? snipLine('注意事項', k.cautions.join(' '), qTerms) || '「注意事項」の中の言葉に当たった'
      : herbOnly ? snipLine('生薬の役割', [k.how, ...k.herbs.map(h => h[1] + '：' + h[3])].join(' '), qTerms) || '生薬の役割の中の言葉に当たった'
      : hitIdx.length ? '当てはまる場面：' + markAll(hitIdx.map(i => k.scenes[i].t).join('／'), sceneTerms)
      : inGist ? ''
      : snipLine('効能・効果', k.kounou, qTerms) || snipLine('使用目標', k.hito, qTerms) || snipLine('生薬', k.herbs.map(h => h[1]).join('・'), qTerms)
        || snipLine('処方の組み立て', k.how, qTerms) || snipLine('注意事項', k.cautions.join(' '), qTerms)
        /* 画面に出ない検索用の語（kw）だけで当たったときは、当たった語をそのまま見せる */
        || kwLine(k, qTerms);
    hb.hidden = !html;
    hb.innerHTML = html;
    hb.classList.toggle('weak', weak);
  });
  KAMPO.map(k => k.id).sort((a, b) => rank[a] - rank[b] || KAMPO.findIndex(k => k.id === a) - KAMPO.findIndex(k => k.id === b))
    .forEach(id => list.appendChild(document.getElementById(id)));
  /* 1品目に絞れたら開いておく */
  const searching = terms.length || cat >= 0;
  if (searching && shown.length === 1) document.getElementById(shown[0]).open = true;
  empty.hidden = shown.length > 0;
  hit.textContent = searching ? (cat >= 0 ? `「${CATS[cat].label}」` : '') + `${KAMPO.length}品目中 ${shown.length - weakN}品目` + (weakN ? `（ほかに説明文だけに当たった${weakN}品目を後ろに表示）` : '') : `${KAMPO.length}品目（名前を押すと開く）`;
  [...chipsEl.children].forEach(b => b.classList.toggle('on', Number(b.dataset.i) === cat));
}
q.addEventListener('input', apply);
chipsEl.addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  const i = Number(e.target.dataset.i);
  cat = cat === i ? -1 : i;  /* もう一度押すと解除。検索欄の言葉とは両方満たすものを出す */
  apply();
});
apply();
</script>
