<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実務チェックリスト｜調剤報酬まとめ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --blue: #1e5fa8; --blue-light: #e8f0fb; --ink: #222222; --sub: #666666;
  --border: #d8dde8; --white: #ffffff; --bg: #f5f7fa;
  --radius: 10px; --radius-sm: 6px;
  --text-xs: 13px; --text-sm: 15px; --text-md: 16px; --text-lg: 18px; --text-xl: 22px;
}
body { font-family: "Noto Sans JP", sans-serif; background: var(--bg); color: var(--ink); font-size: var(--text-md); line-height: 1.8; padding: 32px 16px 60px; }
.page { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.page-title { border-left: 4px solid var(--blue); padding: 6px 0 6px 18px; }
.page-title h1 { font-size: var(--text-xl); font-weight: 900; }
.page-title p { font-size: var(--text-sm); font-weight: 500; margin-top: 4px; color: var(--sub); }

.tool-list { display: flex; flex-direction: column; gap: 12px; }

.tool-card {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 22px 26px;
  text-decoration: none;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 18px;
  transition: border-color 0.2s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.2s cubic-bezier(0.2,0.8,0.2,1), transform 0.2s cubic-bezier(0.2,0.8,0.2,1);
}
.tool-card:hover {
  border-color: var(--blue);
  box-shadow: 0 8px 28px rgba(30, 95, 168, 0.1);
  transform: translateY(-2px);
}
.tool-icon {
  width: 48px; height: 48px; flex-shrink: 0;
  background: var(--blue-light);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.tool-icon svg { width: 24px; height: 24px; stroke: var(--blue); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tool-body { flex: 1; }
.tool-name { font-size: var(--text-lg); font-weight: 700; margin-bottom: 4px; }
.tool-desc { font-size: var(--text-xs); color: var(--sub); }
.tool-arrow { font-size: 20px; color: var(--sub); flex-shrink: 0; }

.note { font-size: 12px; color: var(--sub); padding: 0 2px; }

@media (max-width: 640px) {
  body { padding: 14px 12px 40px; }
  .tool-card { padding: 16px; gap: 14px; }
  .tool-name { font-size: var(--text-md); }
}
</style>
</head>
<body>
    <script src="assets/site-header.js" defer></script>
    <script src="assets/page-meta.js" defer></script>
    <script src="assets/last-updated.js" defer></script>
<div class="page">

  <div class="page-title">
    <h1>実務チェックリスト</h1>
    <p>印刷して現場で使える、算定もれ防止の確認リストをまとめています</p>
  </div>

  <div class="tool-list">

    <a class="tool-card" href="選定療養_実務チェックリスト.html">
      <div class="tool-icon">
        <svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 0 1 1 1v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1z"/><path d="M9 13l2 2 4-4"/></svg>
      </div>
      <div class="tool-body">
        <div class="tool-name">選定療養 実務チェックリスト</div>
        <div class="tool-desc">長期収載品の値上げ（1/4→1/2）に伴う特管3（ロ）の再算定と、通常の初回算定を1ページで確認。説明→算定→薬歴記載の流れと、保険給付時の摘要欄も収録。</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>

  </div>

  <p class="note">※ チェックリストは随時追加予定です。</p>

</div>
<script data-goatcounter="https://kimura-chozai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
